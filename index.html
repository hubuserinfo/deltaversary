<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deltaversary Planner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #9B1B30;
    --crimson-deep: #6B1121;
    --crimson-soft: #F3E3E0;
    --cream: #F7F1E6;
    --cream-2: #EFE5D3;
    --paper: #FFFDF8;
    --ink: #2B1B1D;
    --muted: #7C6B66;
    --line: #E3D7C3;
    --ok: #3F6B4A;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 120px; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--crimson); }

  /* ---------- Login ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--crimson-deep); background-image: radial-gradient(circle at 50% 0%, var(--crimson) 0%, var(--crimson-deep) 70%); }
  .login-card { width: 100%; max-width: 420px; background: var(--paper); padding: 48px 36px 40px; text-align: center; border-top: 3px solid var(--crimson); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .eyebrow { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--crimson); }
  .login-card h1 { font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.05; margin: 14px 0 6px; letter-spacing: .01em; }
  .login-card .sub { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); margin: 0 0 30px; }
  .login-card input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); background: var(--cream); text-align: center; letter-spacing: .06em; }
  .login-card input:focus { outline: none; border-color: var(--crimson); background: var(--paper); }
  .login-msg { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--crimson); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--crimson); background: var(--crimson); color: var(--cream); padding: 11px 22px; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; transition: background .2s, color .2s; }
  .btn:hover { background: var(--crimson-deep); border-color: var(--crimson-deep); }
  .btn.ghost { background: transparent; color: var(--crimson); }
  .btn.ghost:hover { background: var(--crimson); color: var(--cream); }
  .btn.block { width: 100%; margin-top: 14px; padding: 14px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .link-btn { border: 0; background: none; padding: 4px 2px; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  .link-btn:hover { color: var(--crimson); }
  .link-btn.danger:hover { color: #A12A1E; }

  /* ---------- Hero ---------- */
  .hero { background: var(--crimson-deep); background-image: radial-gradient(ellipse at 50% -20%, var(--crimson) 0%, var(--crimson-deep) 75%); color: var(--cream); text-align: center; padding: 56px 16px 46px; position: relative; }
  .hero .eyebrow { color: #E9CFC4; }
  .hero h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(42px, 7vw, 74px); line-height: 1; margin: 16px 0 10px; letter-spacing: .01em; }
  .hero .num { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 3vw, 27px); color: #F2DED6; }
  .hero .where { margin-top: 18px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #EAD3CA; }
  .hero .count { display: inline-block; margin-top: 22px; padding: 8px 18px; border: 1px solid rgba(247,241,230,.45); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  .hero-tools { position: absolute; top: 14px; right: 16px; display: flex; gap: 14px; align-items: center; }
  .hero-tools .link-btn { color: #E5C9BF; }
  .hero-tools .link-btn:hover { color: var(--cream); }
  .sync { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #E5C9BF; }

  /* ---------- Navigation ---------- */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .years, .secnav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .years::-webkit-scrollbar, .secnav::-webkit-scrollbar { display: none; }
  .years { justify-content: center; border-bottom: 1px solid var(--line); }
  .years button { flex: none; border: 0; background: none; padding: 14px 14px 12px; font-family: var(--serif); font-size: 19px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .years button.on { color: var(--crimson); border-bottom-color: var(--crimson); }
  .years button.add { font-family: var(--sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
  .secnav a { flex: none; padding: 11px 12px; font-size: 11px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .secnav a:hover { color: var(--crimson); }

  /* ---------- Sections ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 30px 16px 60px; }
  .section { background: var(--paper); border: 1px solid var(--line); padding: 40px 44px; margin-bottom: 28px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.1; margin: 0; }
  .sec-intro { color: var(--muted); margin: 0 0 26px; max-width: 64ch; }
  h3.sub { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--crimson); margin: 34px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  h3.sub:first-of-type { margin-top: 10px; }
  .empty { padding: 18px 0; color: var(--muted); font-style: italic; font-family: var(--serif); font-size: 18px; }

  /* Saved rows: quiet text, no form chrome */
  .rows { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: var(--cols); gap: 18px; align-items: start; padding: 15px 4px; border-bottom: 1px solid var(--line); }
  .row.head { padding: 10px 4px; font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .cell { min-width: 0; overflow-wrap: anywhere; }
  .cell.primary { font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1.25; }
  .meta { font-family: var(--sans); font-size: 14px; font-weight: 300; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .meta span + span::before { content: '·'; margin: 0 8px; color: var(--line); }
  .dash { color: #C9BBAA; }
  .acts { display: flex; gap: 10px; justify-content: flex-end; white-space: nowrap; }
  .group-label { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--crimson); padding: 22px 4px 6px; border-bottom: 1px solid var(--line); }
  .badge { display: inline-block; padding: 3px 10px; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
  .badge.good { border-color: var(--crimson); background: var(--crimson); color: var(--cream); }
  .badge.warm { border-color: var(--crimson); color: var(--crimson); }
  .badge.dim { color: #AE9E95; border-style: dashed; }

  /* Editing / new entries: a clearly different, framed form */
  .editor { margin: 12px 0; padding: 22px 22px 18px; background: var(--cream); border: 1px solid var(--line); border-left: 3px solid var(--crimson); }
  .editor.draft { border-style: dashed; border-left-style: solid; }
  .editor-label { font-size: 10.5px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--crimson); margin-bottom: 14px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 16px; }
  .fgrid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 0; font-weight: 400; font-size: 15px; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--crimson); }
  .ed-acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .ed-acts .btn { padding: 9px 18px; }
  .add-row { margin-top: 18px; }

  /* Settings blocks */
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 28px; }
  .kv .item { padding: 13px 0; border-bottom: 1px solid var(--line); }
  .kv .item.full { grid-column: 1 / -1; }
  .kv .k { font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .kv .v { font-family: var(--serif); font-size: 20px; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
  .kv-acts { display: flex; justify-content: flex-end; margin-top: 14px; }
  .kv.clickable { cursor: pointer; }
  .kv.clickable .item:hover .v, .kv.clickable .item:hover .dash { color: var(--crimson); }
  .btn.sm { padding: 8px 16px; font-size: 11px; }

  /* Recap (past years) */
  .recap-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 44px; }
  .rc-block + .rc-block { margin-top: 6px; }
  .rc-block h3.sub { margin-top: 26px; }
  .recap-grid > div > .rc-block:first-child h3.sub { margin-top: 0; }
  .rc-day { font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--crimson); margin: 18px 0 4px; }
  .rc-ev { display: grid; grid-template-columns: 80px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rc-time { font-size: 13px; color: var(--muted); padding-top: 4px; }
  .rc-name { font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.3; }
  .rc-list { list-style: none; margin: 0; padding: 0; }
  .rc-list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .rc-list li > div { flex: 1 1 100%; }
  .rc-who { color: var(--muted); font-size: 14px; }
  .rc-p { margin: 6px 0 0; color: var(--ink); font-size: 15px; }
  .rc-quote { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.4; }
  .rc-names { display: flex; flex-wrap: wrap; gap: 8px; }
  .rc-chip { padding: 5px 12px; border: 1px solid var(--line); background: var(--cream); font-size: 14px; }
  .rc-lead { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--ink); margin: 0 0 26px; max-width: 70ch; }
  .rc-note { margin: 36px 0 0; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--muted); }

  /* Wish list cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card { border: 1px solid var(--line); padding: 20px 20px 14px; background: var(--paper); display: flex; flex-direction: column; }
  .card h4 { font-family: var(--serif); font-weight: 500; font-size: 23px; margin: 0 0 8px; }
  .card .k { font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .card p { margin: 2px 0 0; white-space: pre-wrap; }
  .card .acts { margin-top: auto; padding-top: 12px; }
  .cards .editor { grid-column: 1 / -1; margin: 0; }

  /* Overview */
  .overview-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 36px; }
  .wx { border: 1px solid var(--line); padding: 20px 22px; background: var(--cream); align-self: start; }
  .wx h4 { margin: 0 0 12px; font-size: 10.5px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--crimson); }
  .wx .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; }
  .wx .d { text-align: center; padding: 8px 4px; background: var(--paper); border: 1px solid var(--line); }
  .wx .d b { display: block; font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .wx .t { font-family: var(--serif); font-size: 22px; }
  .wx .c { font-size: 12.5px; color: var(--muted); }
  .wx .note { color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 0; flex-wrap: wrap; margin-top: 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { flex: 1 1 120px; padding: 16px 10px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .n { font-family: var(--serif); font-size: 34px; line-height: 1; color: var(--crimson); }
  .stat .l { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

  .memoriam { margin: 34px auto 6px; padding: 26px 16px 24px; max-width: 520px; text-align: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .memoriam .eyebrow { color: var(--muted); }
  .mem-name { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--crimson); margin-top: 8px; }
  .mem-line { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
  .mem-tag { display: inline-block; margin-left: 10px; font-family: var(--sans); font-style: normal; font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); vertical-align: middle; }
  .foot-mem { margin-top: 10px; font-family: var(--serif); font-style: italic; font-size: 16px; letter-spacing: 0; text-transform: none; }
  details.roster { margin-top: 30px; }
  details.roster summary { cursor: pointer; font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding: 10px 0; }
  details.roster summary:hover { color: var(--crimson); }

  footer { text-align: center; padding: 10px 16px 50px; color: var(--muted); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  footer .serif { font-family: var(--serif); font-style: italic; font-size: 18px; letter-spacing: 0; text-transform: none; display: block; margin-bottom: 6px; color: var(--crimson); }

  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ph { margin: 0; }
  .ph-img { display: block; width: 100%; padding: 0; border: 0; background: var(--cream-2); cursor: zoom-in; aspect-ratio: 4 / 3; overflow: hidden; }
  .ph-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .ph-img:hover img { transform: scale(1.03); }
  .ph figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 2px 0; font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.35; }
  .ph-acts { display: flex; gap: 8px; font-style: normal; }
  .up-status { margin-left: 14px; font-size: 13px; color: var(--muted); }
  .rc-photos { margin: 0 0 30px; }
  .rc-highlights { margin: 0 0 30px; }
  .rc-highlights ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 44px; }
  .rc-highlights li { break-inside: avoid; padding: 10px 0 10px 22px; position: relative; font-family: var(--serif); font-size: 19px; line-height: 1.35; border-bottom: 1px solid var(--line); }
  .rc-highlights li::before { content: ''; position: absolute; left: 2px; top: 19px; width: 8px; height: 8px; background: var(--crimson); transform: rotate(45deg); }
  #lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(30, 12, 15, .94); display: grid; place-items: center; padding: 56px 16px 24px; }
  #lightbox figure { margin: 0; max-width: 1200px; text-align: center; }
  #lightbox img { max-width: 100%; max-height: calc(100vh - 140px); object-fit: contain; display: block; margin: 0 auto; }
  #lightbox figcaption { color: var(--cream); font-family: var(--serif); font-style: italic; font-size: 19px; margin-top: 12px; }
  #lightbox figcaption span { display: block; font-family: var(--sans); font-style: normal; font-size: 11px; letter-spacing: .2em; color: #CDB3AA; margin-top: 4px; }
  .lb-x, .lb-nav { position: absolute; border: 0; background: none; color: var(--cream); font-size: 40px; line-height: 1; cursor: pointer; padding: 10px 14px; }
  .lb-x { top: 8px; right: 12px; }
  .lb-nav.prev { left: 6px; top: 50%; transform: translateY(-50%); }
  .lb-nav.next { right: 6px; top: 50%; transform: translateY(-50%); }
  .ach-filters { display: flex; gap: 14px 22px; flex-wrap: wrap; margin: 0 0 22px; }
  .ach-filters label { font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .ach-filters select { padding: 8px 10px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .ach-banner { background: var(--crimson); color: var(--cream); padding: 22px 26px; margin: 0 0 18px; background-image: radial-gradient(ellipse at 100% 0%, #B42A42 0%, var(--crimson) 60%); }
  .ach-banner .eyebrow { color: #EBCFC5; }
  .ach-title { font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1.15; margin-top: 6px; }
  .ach-note { margin-top: 6px; color: #F2DED6; font-size: 15px; }
  .ach-profile { border: 1px solid var(--line); background: var(--cream); padding: 18px 22px; margin: 0 0 18px; }
  .ach-name { font-family: var(--serif); font-size: 26px; font-weight: 500; }
  .ach-roles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rc-muted { color: var(--muted); font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--cream); padding: 12px 20px; font-size: 14px; max-width: calc(100% - 32px); transition: all .25s; z-index: 50; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; padding: 80px 16px; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--muted); }

  @media (max-width: 760px) {
    .section { padding: 28px 18px; }
    .sec-head h2 { font-size: 30px; }
    .overview-grid, .recap-grid { grid-template-columns: 1fr; gap: 24px; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .rc-highlights ul { columns: 1; }
    .row { grid-template-columns: 1fr; gap: 4px; padding: 14px 2px; }
    .row.head { display: none; }
    .cell[data-label]:not(.primary):not(:empty)::before { content: attr(data-label) ': '; font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .acts { justify-content: flex-start; margin-top: 6px; }
    .hero { padding-top: 60px; }
    .hero-tools { left: 16px; right: 16px; justify-content: space-between; }
    .years { justify-content: flex-start; }
    .stat + .stat { border-left: 0; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="eyebrow" id="login-eyebrow"></div>
    <h1>Deltaversary</h1>
    <p class="sub" id="login-sub"></p>
    <input type="password" id="pass" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password">
    <button class="btn block" type="submit" id="login-btn">Enter</button>
    <div class="login-msg" id="login-msg"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="hero" id="hero"></header>
  <div class="bar">
    <nav class="years" id="years" aria-label="Year"></nav>
    <nav class="secnav" id="secnav" aria-label="Sections"></nav>
  </div>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photo-input" accept="image/*" multiple hidden>

<script>
/* =========================================================
   CONFIG — paste your Apps Script Web app URL here
   ========================================================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx8kwDL-fy4cKsg62GLgaZPH0vKfRi6c5SlS2qDbQcfunxlzkPCmvdb4V4QioAyVdSF/exec',
  LINE_NAME: '4x4 Perfect Timing',
  CHAPTER: 'Lumberton Alumnae Chapter',
  LINE_SEASON: 'Spring 2022'
};

/* ---------------- Field & block definitions ---------------- */
const DAY_TYPES = ['Activity', 'Dining', 'Service', 'Celebration', 'Travel', 'Free time'];
const STATUS = ['Idea', 'Planned', 'Booked', 'Done', 'Skipped'];
const RSVP = ['Attending', 'Maybe', 'Not attending'];
const SIZES = ['XS', 'S', 'M', 'L', 'XL', '2X', '3X', '4X'];

  ach: { range: 'since', cat: '', soror: '' } };

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function parseDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtDate(s, long) {
  const d = parseDate(s); if (!d) return s || '';
  return long ? `${WD[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`
              : `${WD[d.getDay()].slice(0, 3)}, ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}
function fmtTime(s) {
  const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); if (!m) return s || '';
  let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`;
}
function fmtRange(a, b) {
  const x = parseDate(a), y = parseDate(b);
  if (!x) return '';
  if (!y || +x === +y) return `${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`;
  if (x.getMonth() === y.getMonth()) return `${MONTHS[x.getMonth()]} ${x.getDate()}–${y.getDate()}, ${y.getFullYear()}`;
  return `${MONTHS[x.getMonth()]} ${x.getDate()} – ${MONTHS[y.getMonth()]} ${y.getDate()}, ${y.getFullYear()}`;
}
function ordinal(n) { n = +n; if (!n) return ''; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function money(s) { const n = parseFloat(String(s || '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }
function trip(day, time, mode, details) {
  const bits = [fmtDate(day), fmtTime(time)].filter(Boolean).join(' at ');
  const sub = [mode, details].filter(Boolean).join(' · ');
  if (!bits && !sub) return '';
  return `${esc(bits)}${sub ? `<div class="meta">${esc(sub)}</div>` : ''}`;
}
function safeUrl(u) { u = String(u || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3600); }
function settingsRow() { return state.settings.find(s => s.Year === state.year) || { id: 'Y' + state.year, Year: state.year }; }
function activeRoster() { return state.roster.filter(r => r.Active !== 'No' && r.Active !== 'In memory').map(r => r.Name).sort((a, b) => a.localeCompare(b)); }
// A soror marked In memory is honored only from her MemorialFrom year on (the first Deltaversary without her).
function remembered(p) { return p.Active === 'In memory' && (!p.MemorialFrom || +state.year >= +p.MemorialFrom); }
function memorialRoster() { return state.roster.filter(remembered); }
function sororInfo(name) { return state.roster.find(r => r.Name === name) || {}; }
function lineNum(name) { const n = parseInt(sororInfo(name).LineNumber, 10); return isNaN(n) ? 999 : n; }
function lineLabel(p) { return [p.LineNumber ? '#' + p.LineNumber : '', p.LineName].filter(Boolean).join(' · '); }
function memorialHTML() {
  const m = memorialRoster(); if (!m.length) return '';
  return `<div class="memoriam"><div class="eyebrow">In Memory Of</div>${m.map(r => `<div class="mem-name">Soror ${esc(r.FullName || r.Name)}</div>${lineLabel(r) ? `<div class="mem-line">${esc(lineLabel(r))}</div>` : ''}`).join('')}</div>`;
}
function tabRows(tab) { return tab === 'Roster' ? state.roster : tab === 'Settings' ? state.settings : tab === 'Achievements' ? state.achievements : (state.data[tab] || []); }
function setTabRows(tab, rows) { if (tab === 'Roster') state.roster = rows; else if (tab === 'Settings') state.settings = rows; else if (tab === 'Achievements') state.achievements = rows; else state.data[tab] = rows; }

/* ---------------- API ---------------- */
async function api(payload) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({}, payload, { key: state.key })) });
  if (!res.ok) throw new Error('Network error (' + res.status + ')');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function setSync(text) { const el = $('#sync'); if (el) el.textContent = text; }
function applyLoad(j) {
  state.year = j.year; state.settings = j.settings; state.roster = j.roster; state.achievements = j.achievements || []; state.data = j.data; state.loaded = true;
  store.set('dv-year', j.year);
}
async function loadYear(year, quiet) {
  if (!quiet) { $('#main').innerHTML = '<div class="loading">Gathering the plans…</div>'; }
  const j = await api({ action: 'load', year });
  applyLoad(j); render();
}

/* ---------------- Login ---------------- */
function initLogin() {
  $('#login-eyebrow').textContent = `${CONFIG.CHAPTER} · ${CONFIG.LINE_SEASON}`;
  $('#login-sub').textContent = CONFIG.LINE_NAME;
  if (!/^https:\/\//.test(CONFIG.API_URL)) {
    $('#login-msg').textContent = 'Setup needed: paste the Apps Script Web app URL into CONFIG.API_URL.';
  }
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const key = $('#pass').value.trim(); if (!key) return;
    await signIn(key, false);
  });
  const saved = store.get('dv-key');
  if (saved) signIn(saved, true);
}
async function signIn(key, silent) {
  state.key = key;
  const btn = $('#login-btn'); btn.disabled = true; $('#login-msg').textContent = silent ? 'Welcome back…' : 'Checking…';
  try {
    const j = await api({ action: 'load', year: store.get('dv-year') || '' });
    store.set('dv-key', key);
    applyLoad(j);
    $('#login').hidden = true; $('#app').hidden = false;
    render();
  } catch (err) {
    store.del('dv-key');
    $('#login-msg').textContent = err.message === 'auth' ? 'That passphrase didn’t match. Please try again.' : 'Couldn’t connect: ' + err.message;
  } finally { btn.disabled = false; }
}
function signOut() { store.del('dv-key'); location.reload(); }

/* ---------------- Rendering ---------------- */
function render() {
  const s = settingsRow();
  const past = isPast(s);
  if (past) Object.keys(state.edits).forEach(k => { if (!k.startsWith('photos:')) delete state.edits[k]; });
  renderHero(s, past);
  renderYears();
  $('#secnav').hidden = past;
  $('#secnav').innerHTML = past ? '' : SECTIONS.map(x => `<a href="#${x.id}">${esc(x.title)}</a>`).join('');
  $('#main').innerHTML = past ? recapHTML(s) : SECTIONS.map(x => sectionHTML(x, s)).join('');
  const mem = memorialRoster().map(r => 'Soror ' + (r.FullName || r.Name)).join(' · ');
  $('#footer').innerHTML = `<span class="serif">${esc(CONFIG.LINE_NAME)}</span>${esc(CONFIG.CHAPTER)} · ${esc(CONFIG.LINE_SEASON)}`
    + (mem ? `<div class="foot-mem">In memory of ${esc(mem)}</div>` : '');
  if (!past) loadWeather(s);
}

// A year is in the past once its dates have passed. Years with no dates recorded count as past
// when they are earlier than this year, or this year with a later year already being planned.
function isPast(s) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const end = parseDate(s.EndDate) || parseDate(s.StartDate);
  if (end) return end < today;
  const y = +s.Year, cy = today.getFullYear();
  return y < cy || (y === cy && state.settings.some(x => +x.Year > y));
}

function renderHero(s, past) {
  const num = s.Number ? `The ${ordinal(s.Number)} Deltaversary` : 'Deltaversary';
  const where = [s.City, fmtRange(s.StartDate, s.EndDate)].filter(Boolean).join(' · ') || (past ? '' : 'Destination & dates to be decided');
  let count = past ? 'Celebrated' : '';
  const start = parseDate(s.StartDate), end = parseDate(s.EndDate) || start;
  if (start) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((start - today) / 864e5);
    if (days > 1) count = `${days} days to go`;
    else if (days === 1) count = 'Tomorrow';
    else if (today <= end) count = 'Celebrating now';
    else count = 'Celebrated';
  }
  $('#hero').innerHTML = `
    <div class="hero-tools"><span class="sync" id="sync"></span><span>
      <button class="link-btn" data-act="refresh">Refresh</button>
      <button class="link-btn" data-act="signout">Sign out</button></span></div>
    <div class="eyebrow">${esc(CONFIG.CHAPTER)} · ${esc(CONFIG.LINE_SEASON)}</div>
    <h1>${esc(CONFIG.LINE_NAME)}</h1>
    <div class="num">${esc(num)}${s.Theme ? ` — ${esc(s.Theme)}` : ''}</div>
    ${where ? `<div class="where">${esc(where)}</div>` : ''}
    ${count ? `<div class="count">${esc(count)}</div>` : ''}`;
}

function renderYears() {
  const years = state.settings.map(s => s.Year).sort();
  const next = years.length ? +years[years.length - 1] + 1 : new Date().getFullYear();
  $('#years').innerHTML = years.map(y => `<button class="${y === state.year ? 'on' : ''}" data-act="year" data-year="${esc(y)}">${esc(y)}</button>`).join('')
    + `<button class="add" data-act="newyear" data-year="${next}">+ Plan ${next}</button>`;
}

function sectionHTML(sec, s) {
  const head = (intro) => `<div class="sec-head"><h2>${esc(sec.title)}</h2></div>${intro ? `<p class="sec-intro">${intro}</p>` : ''}`;
  let body = '';
  switch (sec.id) {
    case 'overview': {
      const att = (state.data.Attendance || []).filter(r => r.Status === 'Attending').length;
      const maybe = (state.data.Attendance || []).filter(r => r.Status === 'Maybe').length;
      const events = (state.data.Itinerary || []).length;
      const booked = (state.data.Itinerary || []).filter(r => r.Status === 'Booked' || r.Status === 'Done').length;
      body = head('The essentials for this year’s celebration. Everyone with the passphrase sees the same plan, so changes show up for the whole line.')
        + `<div class="overview-grid"><div>${settingsBlock('overview', s)}</div><div class="wx" id="wx"><h4>Weather</h4><div class="note">Add a city and dates to see the forecast.</div></div></div>
           <div class="stats">
             <div class="stat"><div class="n">${att}</div><div class="l">Attending</div></div>
             <div class="stat"><div class="n">${maybe}</div><div class="l">Maybe</div></div>
             <div class="stat"><div class="n">${events}</div><div class="l">On the itinerary</div></div>
             <div class="stat"><div class="n">${booked}</div><div class="l">Booked or done</div></div>
           </div>`;
      break;
    }
    case 'coming':
      body = head('RSVPs and T-shirt sizes for everyone on the line. Each soror can update her own row.')
        + listBlock('attendance')
        + memorialHTML()
        + `<details class="roster"${state.edits && Object.keys(state.edits).some(k => k.startsWith('roster:')) ? ' open' : ''}><summary>Line roster (${state.roster.length})</summary>${listBlock('roster')}</details>`;
      break;
    case 'itinerary':
      body = head('Everything on the schedule, by day. Mark each event as booked, done or skipped, since we don’t always get to everything.') + listBlock('itinerary');
      break;
    case 'secret':
      body = head('Our standing tradition. Draw names, then fill in your wish list so your Secret Soror has time to shop.')
        + settingsBlock('secret', s) + `<h3 class="sub">Wish lists</h3>` + listBlock('wishlist');
      break;
    case 'service':
      body = head('Public service and scholarship projects for this Deltaversary, plus the donation sign-up.')
        + `<h3 class="sub">Projects</h3>` + listBlock('service') + `<h3 class="sub">Donation sign-up</h3>` + listBlock('signup');
      break;
    case 'games':
      body = head('Games, music, movies and anything else for the fun nights, and who is bringing or hosting it.') + listBlock('games');
      break;
    case 'bring':
      body = head('Shared items for the group and who is bringing each one.') + listBlock('bring');
      break;
    case 'lodging':
      body = head('Where we are staying, the options we compared, and who is in which room.')
        + `<h3 class="sub">Our stay</h3>` + settingsBlock('stay', s)
        + `<h3 class="sub">Options considered</h3>` + listBlock('lodging')
        + `<h3 class="sub">Room assignments</h3>` + listBlock('rooms');
      break;
    case 'collections': {
      const rows = state.data.Collections || [];
      const total = rows.reduce((a, r) => a + money(r.Amount), 0);
      const paid = rows.filter(r => r.Paid === 'Yes').reduce((a, r) => a + money(r.Amount), 0);
      const f = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      body = head('Dues and shared costs: what each soror owes and whether it has been paid.')
        + (rows.length ? `<div class="stats" style="margin:0 0 22px"><div class="stat"><div class="n">${f(total)}</div><div class="l">Total</div></div><div class="stat"><div class="n">${f(paid)}</div><div class="l">Collected</div></div><div class="stat"><div class="n">${f(total - paid)}</div><div class="l">Outstanding</div></div></div>` : '')
        + listBlock('collections');
      break;
    }
    case 'travel':
      body = head('Arrivals and departures for everyone marked Attending or Maybe, so we can coordinate rides and pickups.') + listBlock('travel');
      break;
    case 'achievements':
      body = head('Delta honors and personal milestones across the line, ready to celebrate when we gather. Anyone can add a Delta honor for a sister; personal achievements are shared by the sister herself.')
        + achievementsHTML();
      break;
    case 'memories':
      body = head('Photos and highlights from the weekend, and comments to bring to the next meeting so the next Deltaversary is even better.')
        + `<h3 class="sub">Photos</h3>` + galleryHTML()
        + `<h3 class="sub">Highlights</h3>` + listBlock('highlights')
        + `<h3 class="sub">Album & notes</h3>` + settingsBlock('memories', s)
        + `<h3 class="sub">Comments for the next meeting</h3>` + listBlock('feedback');
      break;
  }
  return `<section class="section" id="${sec.id}">${body}</section>`;
}

/* ----- Achievements ----- */
function fmtMonth(v) { const m = /^(\d{4})-(\d{2})/.exec(v || ''); return m ? `${MONTHS[+m[2] - 1]} ${m[1]}` : (v || ''); }
function achYear(a) { return (a.Date || '').slice(0, 4) || (a.StartYear ? String(a.StartYear) : ''); }
function achIsRole(a) { return !a.Date && !!a.StartYear; }
function achWhen(a) {
  if (a.Date) return fmtMonth(a.Date);
  if (a.StartYear) return `${a.StartYear}–${a.EndYear && !/present/i.test(a.EndYear) ? a.EndYear : 'present'}`;
  return '';
}
function achActiveIn(a, y) {
  if (!achIsRole(a)) return false;
  const end = !a.EndYear || /present/i.test(a.EndYear) ? 9999 : +a.EndYear;
  return +a.StartYear <= y && y <= end;
}
function achSortKey(a) { return a.Date || (a.StartYear ? a.StartYear + '-00' : '0000'); }
// The day after the most recent Deltaversary before the year being viewed.
function lastDeltaversaryDate() {
  const prior = state.settings.filter(x => +x.Year < +state.year).sort((a, c) => +c.Year - +a.Year)[0];
  if (!prior) return '';
  return prior.EndDate || prior.StartDate || `${prior.Year}-04-24`;
}
function achInRange(a) {
  if (state.ach.range === 'all') return true;
  const since = lastDeltaversaryDate(); if (!since) return true;
  if (achIsRole(a)) { const end = !a.EndYear || /present/i.test(a.EndYear) ? 9999 : +a.EndYear; return end >= +since.slice(0, 4); }
  return (a.Date || '') > since;
}
function achievementRows() {
  return state.achievements
    .filter(a => a.Scope !== 'Line' && achInRange(a))
    .filter(a => !state.ach.cat || a.Category === state.ach.cat)
    .filter(a => !state.ach.soror || a.Soror === state.ach.soror)
    .sort((a, c) => achSortKey(c).localeCompare(achSortKey(a)) || (a.Title || '').localeCompare(c.Title || ''));
}
function achievementProblem(r) {
  if (r.Scope !== 'Line' && !r.Soror) return 'Please choose the soror this achievement belongs to.';
  if (r.Category === 'Personal' && r.Scope !== 'Line' && r.AddedBy !== r.Soror) return 'Personal achievements are added by the sister herself. Choose her name under “Who is adding this.”';
  if (!r.Date && !r.StartYear) return 'Add the month it happened, or the year she started serving.';
  return '';
}
function sororCell(name) {
  if (!name) return '<span class="dash">—</span>';
  const p = sororInfo(name);
  return `${esc(name)}${remembered(p) ? '<span class="mem-tag">In memory</span>' : ''}${lineLabel(p) ? `<div class="meta">${esc(lineLabel(p))}</div>` : ''}`;
}
function achBanners(list) {
  return list.filter(a => a.Scope === 'Line').map(a => `<div class="ach-banner"><div class="eyebrow">${esc(CONFIG.LINE_NAME)} · ${esc(achWhen(a))}</div><div class="ach-title">${esc(a.Title)}</div>${a.Notes ? `<div class="ach-note">${esc(a.Notes)}</div>` : ''}</div>`).join('');
}
function achievementsHTML() {
  const f = state.ach;
  const since = lastDeltaversaryDate();
  const banners = f.soror ? '' : achBanners(state.achievements.filter(a => a.Scope === 'Line' && achInRange(a) && (!f.cat || a.Category === f.cat)));
  const sorors = state.roster.slice().sort((a, c) => lineNum(a.Name) - lineNum(c.Name));
  const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`;
  const controls = `<div class="ach-filters">
    <label>Show <select data-filter="range">${opt('since', since ? 'Since our last Deltaversary' : 'All Years', f.range)}${since ? opt('all', 'All years', f.range) : ''}</select></label>
    <label>Kind <select data-filter="cat">${opt('', 'Delta & Personal', f.cat)}${opt('Delta', 'Delta', f.cat)}${opt('Personal', 'Personal', f.cat)}</select></label>
    <label>Soror <select data-filter="soror">${opt('', 'Whole Line', f.soror)}${sorors.map(p => opt(p.Name, p.Name, f.soror)).join('')}</select></label>
  </div>`;
  let profile = '';
  if (f.soror) {
    const p = sororInfo(f.soror);
    const roles = state.achievements.filter(a => a.Soror === f.soror && achIsRole(a) && achActiveIn(a, new Date().getFullYear()));
    profile = `<div class="ach-profile"><div class="ach-name">Soror ${esc(p.FullName || f.soror)}${remembered(p) ? '<span class="mem-tag">In memory</span>' : ''}</div>
      <div class="meta">${esc(lineLabel(p))}</div>
      ${roles.length ? `<div class="ach-roles">${roles.map(a => `<span class="rc-chip">${esc([a.Role, a.Title].filter(Boolean).join(', '))}</span>`).join('')}</div>` : ''}</div>`;
  }
  BLOCKS.achievements.emptyText = () => f.range === 'since' && since
    ? `Nothing recorded since ${fmtDate(since, true).split(', ')[1]}, ${since.slice(0, 4)} yet. Choose “All years” to see everything.`
    : 'No achievements recorded yet.';
  return controls + banners + profile + listBlock('achievements');
}

function galleryHTML() {

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`Couldn’t read ${file.name}. Try a JPEG or PNG.`)); };
    img.src = url;
  });
}

async function uploadPhotos(files) {
  const year = state.year; const list = Array.from(files).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if (!list.length) return;
  let done = 0, failed = 0; state.pending++;
  const status = t => { const el = $('#up-status'); if (el) el.textContent = t; setSync(t); };
  for (const f of list) {
    status(`Uploading ${done + failed + 1} of ${list.length}…`);
    try {
      const data = await resizeImage(f, 1800);
      const j = await api({ action: 'uploadPhoto', year, name: f.name.replace(/\.[^.]+$/, '') + '.jpg', data });
      if (state.year === year) { state.data.Photos = (state.data.Photos || []).concat([j.row]); }
      done++;
    } catch (err) { failed++; toast(err.message === 'auth' ? 'Please sign in again.' : `Photo not added: ${err.message}`); }
  }
  state.pending--;
  render();
  setSync(failed ? `${done} added, ${failed} failed` : `${done} photo${done === 1 ? '' : 's'} added`);
}

function openLightbox(i) {
  const rows = (state.data.Photos || []).slice().sort((a, b) => (+a.Order || 0) - (+b.Order || 0));
  if (!rows.length) return;
  const n = rows.length; i = (i + n) % n; const r = rows[i];
  let lb = $('#lightbox');
  if (!lb) { lb = document.createElement('div'); lb.id = 'lightbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); document.body.appendChild(lb); }
  lb.dataset.i = i;
  lb.innerHTML = `<button class="lb-x" data-act="lb-close" aria-label="Close">×</button>
    ${n > 1 ? `<button class="lb-nav prev" data-act="lb-go" data-d="-1" aria-label="Previous">‹</button><button class="lb-nav next" data-act="lb-go" data-d="1" aria-label="Next">›</button>` : ''}
    <figure><img src="${esc(photoSrc(r.FileId, 2000))}" alt="${esc(r.Caption || 'Deltaversary photo')}"><figcaption>${esc(r.Caption || '')}<span>${i + 1} / ${n}</span></figcaption></figure>`;
  lb.hidden = false; document.body.style.overflow = 'hidden';
}
function closeLightbox() { const lb = $('#lightbox'); if (lb) { lb.hidden = true; lb.innerHTML = ''; } document.body.style.overflow = ''; }

/* ----- Recap card for past years (read-only) ----- */
function recapHTML(s) {
  const D = state.data;
  const meta = (r, keys) => { const m = keys.filter(k => r[k]).map(k => `<span>${esc(r[k])}</span>`).join(''); return m ? `<div class="meta">${m}</div>` : ''; };
  const block = (title, inner) => inner ? `<div class="rc-block"><h3 class="sub">${esc(title)}</h3>${inner}</div>` : '';
  const list = items => items.length ? `<ul class="rc-list">${items.join('')}</ul>` : '';

  const itin = blockRows('itinerary');
  let weekend = '', last = null;
  itin.forEach(r => {
    const g = r.Day || '';
    if (g !== last) { weekend += `<div class="rc-day">${g ? esc(fmtDate(g, true)) : 'Date not recorded'}</div>`; last = g; }
    weekend += `<div class="rc-ev"><span class="rc-time">${esc(fmtTime(r.Time))}</span><div><div class="rc-name">${esc(r.Event)}${r.Status === 'Skipped' ? ' <span class="badge dim">Skipped</span>' : ''}</div>${meta(r, ['Location', 'Attire', 'Cost', 'Notes'])}</div></div>`;
  });

  const came = blockRows('attendance').filter(r => r.Status === 'Attending');
  const partial = s.PartialAttendance === 'Yes';

  const service = blockRows('service').map(r => `<li><div class="rc-name">${esc(r.Project)}</div>${meta({ When: [fmtDate(r.Date), fmtTime(r.Time)].filter(Boolean).join(' at '), Location: r.Location, Attire: r.Attire }, ['When', 'Location', 'Attire'])}${r.Summary ? `<p class="rc-p">${esc(r.Summary)}</p>` : ''}</li>`);
  const pair = (rows, a, b) => rows.map(r => `<li><span>${esc(r[a])}</span>${r[b] ? `<span class="rc-who">${esc(r[b])}</span>` : ''}</li>`);
  const album = safeUrl(s.AlbumLink);
  const secret = [s.GiftBudget ? `Gift amount: ${s.GiftBudget}` : '', s.ExchangeDate ? `Exchanged ${fmtDate(s.ExchangeDate, true)}` : ''].filter(Boolean);
  const stay = [s.Lodging, s.Address].filter(Boolean);
  const stats = [[partial ? 0 : came.length, 'Attended'], [itin.length, 'On the itinerary'], [(D.Service || []).length, 'Service projects']].filter(x => x[0]);

  return `<section class="section recap">
    <div class="eyebrow">Recap · ${esc(state.year)}</div>
    <div class="sec-head" style="margin-top:10px"><h2>${esc(s.Number ? `The ${ordinal(s.Number)} Deltaversary` : 'Deltaversary ' + state.year)}</h2></div>
    <p class="sec-intro">${esc([s.City, fmtRange(s.StartDate, s.EndDate)].filter(Boolean).join(' · ') || 'Celebrated together')}</p>
    ${stats.length ? `<div class="stats" style="margin:0 0 30px">${stats.map(x => `<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}</div>` : ''}
    ${s.Notes ? `<p class="rc-lead">${esc(s.Notes)}</p>` : ''}
    <div class="rc-photos">${galleryHTML()}</div>
    ${(D.Highlights || []).length ? `<div class="rc-block rc-highlights"><h3 class="sub">Highlights</h3><ul>${D.Highlights.map(r => `<li>${esc(r.Text)}</li>`).join('')}</ul></div>` : ''}
    <div class="recap-grid">
      <div>${block('The weekend', weekend) || block('The weekend', '<div class="empty">No itinerary was recorded for this year.</div>')}</div>
      <div>
        ${block(partial ? 'Who we know came' : 'Who came', came.length ? `<div class="rc-names">${came.map(r => `<span class="rc-chip">${esc(r.Soror)}</span>`).join('')}</div>${partial ? '<p class="rc-p rc-muted">Others may have joined for part of the celebration. Add anyone missing in the Sheet.</p>' : ''}` : '')}
        ${block('Achievements that year', yearAch.length ? achBanners(yearAch) + list(yearAch.filter(a => a.Scope !== 'Line').map(a => `<li><div class="rc-name">${esc(a.Title)}</div><div class="meta"><span>${esc(a.Soror)}</span>${a.Level ? `<span>${esc(a.Level)}</span>` : ''}<span>${esc(achWhen(a))}</span></div></li>`)) : '')}
        ${block('Where we stayed', stay.length ? `<div class="rc-name">${esc(stay[0])}</div>${stay[1] ? `<div class="meta">${esc(stay[1])}</div>` : ''}` : '')}

      </div>

}

/* ----- Settings blocks (key/value cards) ----- */
function settingsBlock(name, s) {
  const fields = SETTINGS[name];
  const ek = `set-${name}:${s.id}`;
  if (state.edits[ek]) return editorHTML(ek, fields, state.edits[ek], 'Edit details', false);
  const items = fields.map(f => {
    let v = s[f.k];
    if (f.type === 'date') v = fmtDate(v, true);
    const shown = !v ? '<span class="dash">—</span>'
      : f.type === 'url' ? (safeUrl(v) ? `<a href="${esc(safeUrl(v))}" target="_blank" rel="noopener">Open link ↗</a>` : esc(v))
      : esc(v).replace(/\n/g, '<br>');
    return `<div class="item${f.full ? ' full' : ''}"><div class="k">${esc(f.label)}</div><div class="v">${shown}</div></div>`;
  }).join('');
  return `<div class="kv clickable" data-act="edit-set" data-b="${name}" title="Click to edit">${items}</div>
    <div class="kv-acts"><button class="btn ghost sm" data-act="edit-set" data-b="${name}">Edit details</button></div>`;
}

/* ----- Lists ----- */
function blockRows(name) {
  const b = BLOCKS[name];
  if (b.rowsFn) return b.rowsFn();
  let rows = tabRows(b.tab).slice();
  if (b.fixed) {
    const names = activeRoster();
    const byName = {}; rows.forEach(r => { byName[r.Soror] = r; });
    let list = names.map(n => byName[n] || { id: `${state.year}-${n}`, Year: state.year, Soror: n });
    // Sorors no longer active keep their past entries, shown read-only; no empty space is held for them.
    state.roster.filter(p => p.Active === 'No' || p.Active === 'In memory').forEach(p => {
      const r = byName[p.Name];
      if (r && b.fields.some(f => r[f.k])) list.push(Object.assign({}, r, { __ro: true, __mem: remembered(p) }));
    });
    list.sort((a, c) => (lineNum(a.Soror) - lineNum(c.Soror)) || a.Soror.localeCompare(c.Soror));
    list = list.map(r => Object.assign({}, r, { __line: lineLabel(sororInfo(r.Soror)) }));
    if (b.fixed === 'attending') list = list.filter(r => r.Status === 'Attending' || r.Status === 'Maybe');
    return list;
  }
  if (b.lineSort) rows.sort((a, c) => ((parseInt(a.LineNumber, 10) || 999) - (parseInt(c.LineNumber, 10) || 999)) || a.Name.localeCompare(c.Name));
  if (b.sort) rows.sort((a, c) => { for (const k of b.sort) { const x = a[k] || '￿', y = c[k] || '￿'; if (x !== y) return x < y ? -1 : 1; } return 0; });
  return rows;
}

function listBlock(name) {
  const b = BLOCKS[name];
  const rows = blockRows(name);
  const drafts = Object.keys(state.edits).filter(k => k.startsWith(name + ':') && state.edits[k].__new);
  let html = '';

  if (b.layout === 'cards') {
    if (!rows.length) html += `<div class="empty">Add sorors to the line roster to start wish lists.</div>`;
    html += `<div class="cards">` + rows.map(r => {
      const ek = `${name}:${r.id}`;
      if (state.edits[ek]) return editorHTML(ek, b.fields, state.edits[ek], `${r.Soror}’s wish list`, false);
      const has = r.Wishes || r.Favorites;
      return `<div class="card"><h4>${esc(r.Soror)}${r.__mem ? '<span class="mem-tag">In memory</span>' : ''}</h4>
        ${r.__line ? `<div class="meta" style="margin:-6px 0 8px">${esc(r.__line)}</div>` : ''}
        ${has ? '' : '<p class="dash" style="font-style:italic">No wish list yet</p>'}
        ${r.Wishes ? `<div class="k">Wish list</div><p>${linkify(r.Wishes)}</p>` : ''}
        ${r.Favorites ? `<div class="k">Favorites & sizes</div><p>${esc(r.Favorites)}</p>` : ''}
        ${r.__ro ? '' : `<div class="acts"><button class="link-btn" data-act="edit" data-b="${name}" data-id="${esc(r.id)}">${has ? 'Edit' : 'Add wish list'}</button></div>`}</div>`;
    }).join('') + `</div>`;
    return html;
  }

  const cols = b.cols;
  const tmpl = cols.map(c => c.w).join(' ') + ' auto';
  if (!rows.length && !drafts.length) {
    html += `<div class="empty">${b.fixed === 'attending' ? 'No one is marked Attending or Maybe yet. Update RSVPs in Who’s Coming.' : (b.emptyText ? b.emptyText() : 'Nothing here yet.')}</div>`;
  } else if (rows.length) {
    html += `<div class="rows" style="--cols:${tmpl}"><div class="row head">${cols.map(c => `<div>${esc(c.label || labelOf(b, c.k))}</div>`).join('')}<div></div></div>`;
    let lastGroup = null;
    rows.forEach(r => {
      if (b.groupFn) {
        const g = b.groupFn(r);
        if (g !== lastGroup) { html += `<div class="group-label">${esc(g)}</div>`; lastGroup = g; }
      } else if (b.groupBy) {
        const g = r[b.groupBy] || '';
        if (g !== lastGroup) { html += `<div class="group-label">${g ? esc(fmtDate(g, true)) : 'Date to be decided'}</div>`; lastGroup = g; }
      }
      const ek = `${name}:${r.id}`;
      if (state.edits[ek]) { html += editorHTML(ek, b.fields, state.edits[ek], b.fixed ? r.Soror : `Edit ${b.noun}`, false); return; }
      html += rowHTML(name, b, r);
    });
    html += `</div>`;
  }
  drafts.forEach(ek => { html += editorHTML(ek, b.fields, state.edits[ek], `New ${b.noun}`, true); });
  if (!b.fixed) html += `<div class="add-row"><button class="btn ghost" data-act="add" data-b="${name}">+ Add ${esc(b.noun)}</button></div>`;
  return html;
}

function labelOf(b, k) { const f = b.fields.find(x => x.k === k); return f ? f.label : k; }

function cellValue(b, c, r) {
  if (c.render) return c.render(r);
  const f = b.fields.find(x => x.k === c.k) || {};
  let v = r[c.k];
  if (!v) return '';
  if (f.type === 'date') return esc(fmtDate(v));
  if (f.type === 'month') return esc(fmtMonth(v));
  if (f.type === 'time') return esc(fmtTime(v));
  if (c.badge) {
    const cls = ['Attending', 'Booked', 'Done', 'Yes'].includes(v) ? 'good' : ['Maybe', 'Planned'].includes(v) ? 'warm' : ['Skipped', 'Not attending', 'No', 'Idea'].includes(v) ? 'dim' : '';
    return `<span class="badge ${cls}">${esc(v)}</span>`;
  }
  return c.plain ? esc(v).replace(/\n/g, '<br>') : esc(v);
}

function rowHTML(name, b, r) {
  const cells = b.cols.map(c => {
    let inner = cellValue(b, c, r);
    if (c.primary) {
      if (!inner) inner = '<span class="dash">—</span>';
      if (c.meta) {
        const m = c.meta.map(k => {
          const f = b.fields.find(x => x.k === k) || {};
          if (!r[k]) return '';
          if (f.type === 'url') { const u = safeUrl(r[k]); return u ? `<span><a href="${esc(u)}" target="_blank" rel="noopener">Link ↗</a></span>` : ''; }
          return `<span>${esc(r[k])}</span>`;
        }).filter(Boolean).join('');
        if (m) inner += `<div class="meta">${m}</div>`;
      }
      if (r.__mem) inner += '<span class="mem-tag">In memory</span>';
      if (r.__line) inner += `<div class="meta">${esc(r.__line)}</div>`;
      return `<div class="cell primary">${inner}</div>`;
    }
    return `<div class="cell" data-label="${esc(c.label || labelOf(b, c.k))}">${inner}</div>`;
  }).join('');
  if (r.__ro) return `<div class="row">${cells}<div class="acts"></div></div>`;
  const isEmptyFixed = b.fixed && !b.fields.some(f => r[f.k]);
  const acts = `<button class="link-btn" data-act="edit" data-b="${name}" data-id="${esc(r.id)}">${isEmptyFixed ? 'Fill in' : 'Edit'}</button>`
    + (b.fixed ? '' : `<button class="link-btn danger" data-act="del" data-b="${name}" data-id="${esc(r.id)}">Remove</button>`);
  return `<div class="row">${cells}<div class="acts">${acts}</div></div>`;
}

function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 42 ? u.slice(0, 40) + '…' : u}</a>`);
}

/* ----- Editor form (used for new entries and edits) ----- */
function editorHTML(ek, fields, vals, title, isDraft) {
  const roster = activeRoster();
  const input = f => {
    const v = vals[f.k] == null ? '' : vals[f.k];
    const a = `data-ek="${esc(ek)}" data-k="${f.k}" id="${esc(ek + '-' + f.k)}"`;
    if (f.type === 'textarea') return `<textarea ${a} placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    if (f.type === 'select' || f.type === 'soror' || f.type === 'sororAll') {
      let opts = f.type === 'soror' ? roster.concat(f.group ? ['Group'] : [])
        : f.type === 'sororAll' ? state.roster.slice().sort((a, c) => lineNum(a.Name) - lineNum(c.Name)).map(p => p.Name) : f.options;
      if (v && !opts.includes(v)) opts = opts.concat([v]);
      return `<select ${a}><option value="">${f.type === 'soror' || f.type === 'sororAll' ? 'Choose a soror' : 'Choose…'}</option>${opts.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    }
    const t = f.type === 'date' ? 'date' : f.type === 'time' ? 'time' : f.type === 'url' ? 'url' : f.type === 'month' ? 'month' : 'text';
    return `<input type="${t}" ${a} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  };
  return `<div class="editor${isDraft ? ' draft' : ''}">
    <div class="editor-label">${esc(title)}</div>
    <div class="fgrid">${fields.map(f => `<div class="field${f.full ? ' full' : ''}"><label for="${esc(ek + '-' + f.k)}">${esc(f.label)}${f.req ? ' *' : ''}</label>${input(f)}</div>`).join('')}</div>
    <div class="ed-acts"><button class="link-btn" data-act="cancel" data-ek="${esc(ek)}">Cancel</button><button class="btn" data-act="save" data-ek="${esc(ek)}">${isDraft ? 'Add' : 'Save'}</button></div>
  </div>`;
}

/* ---------------- Actions ---------------- */
function startEdit(name, id) {
  const b = BLOCKS[name];
  const r = blockRows(name).find(x => x.id === id) || {};
  const vals = {}; b.fields.forEach(f => { vals[f.k] = r[f.k] || ''; });
  state.edits[`${name}:${id}`] = vals;
  render(); focusEditor(`${name}:${id}`);
}
function startAdd(name) {
  const b = BLOCKS[name]; const id = uid();
  const vals = { __new: true }; b.fields.forEach(f => { vals[f.k] = ''; });
  if (name === 'collections') vals.Paid = 'No';
  if (name === 'itinerary') vals.Status = 'Idea';
  if (name === 'roster') vals.Active = 'Yes';
  if (name === 'achievements') { vals.Category = 'Delta'; vals.Scope = 'Individual'; if (state.ach.soror) vals.Soror = state.ach.soror; }
  state.edits[`${name}:${id}`] = vals;
  render(); focusEditor(`${name}:${id}`);
}
function startEditSettings(name) {
  const s = settingsRow(); const vals = {};
  SETTINGS[name].forEach(f => { vals[f.k] = s[f.k] || ''; });
  state.edits[`set-${name}:${s.id}`] = vals;
  render(); focusEditor(`set-${name}:${s.id}`);
}
function focusEditor(ek) {
  const el = document.querySelector(`[data-ek="${CSS.escape(ek)}"][data-k]`);
  if (el) { el.closest('.editor').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); el.focus({ preventScroll: true }); }
}
function cancelEdit(ek) { delete state.edits[ek]; render(); }

async function save(ek) {
  const [name, id] = splitKey(ek);
  const vals = Object.assign({}, state.edits[ek]); delete vals.__new;
  let tab, fields, base;
  if (name.startsWith('set-')) {
    tab = 'Settings'; fields = SETTINGS[name.slice(4)]; base = settingsRow();
  } else {
    const b = BLOCKS[name]; tab = b.tab; fields = b.fields;
    base = tabRows(tab).find(r => r.id === id) || (b.fixed ? blockRows(name).find(r => r.id === id) : {}) || {};
    const miss = fields.find(f => f.req && !String(vals[f.k] || '').trim());
    if (miss) { toast(`Please fill in “${miss.label}”.`); focusEditor(ek); return; }
  }
  const row = Object.assign({}, base, vals, { id });
  Object.keys(row).forEach(k => { if (k.startsWith('__')) delete row[k]; });
  const blk = BLOCKS[name];
  if (!(blk && blk.global)) row.Year = state.year;
  if (name === 'achievements') {
    const problem = achievementProblem(row);
    if (problem) { toast(problem); focusEditor(ek); return; }
    if (row.Scope === 'Line') row.Soror = '';
  }
  if (name === 'roster' && !row.Active) row.Active = 'Yes';
  const before = tabRows(tab).slice();
  const i = before.findIndex(r => r.id === id);
  const next = before.slice(); if (i >= 0) next[i] = row; else next.push(row);
  setTabRows(tab, next);
  const pendingEdit = state.edits[ek]; delete state.edits[ek];
  render();
  try {
    state.pending++; setSync('Saving…');
    await api({ action: 'upsert', tab, row });
    state.pending--; setSync(state.pending ? 'Saving…' : 'Saved');
  } catch (err) {
    state.pending--; setSync('');
    setTabRows(tab, before); state.edits[ek] = pendingEdit; render();
    handleErr(err, 'Couldn’t save');
  }
}

async function remove(name, id) {
  const b = BLOCKS[name];
  const r = tabRows(b.tab).find(x => x.id === id);
  const label = r ? (b.cols ? r[b.cols[0].k] : r.Caption) || '' : '';
  if (!confirm(`Remove ${label ? '“' + String(label).slice(0, 60) + '”' : 'this ' + b.noun}?`)) return;
  const before = tabRows(b.tab).slice();
  setTabRows(b.tab, before.filter(x => x.id !== id)); render();
  try { setSync('Saving…'); await api({ action: 'delete', tab: b.tab, id }); setSync('Saved'); }
  catch (err) { setTabRows(b.tab, before); render(); handleErr(err, 'Couldn’t remove'); }
}

function splitKey(ek) { const i = ek.indexOf(':'); return [ek.slice(0, i), ek.slice(i + 1)]; }
function handleErr(err, prefix) {
  if (err.message === 'auth') { toast('The passphrase has changed. Please sign in again.'); setTimeout(signOut, 1800); return; }
  toast(`${prefix}: ${err.message}`);
}
function hasUnsaved() { return Object.keys(state.edits).length > 0; }

async function switchYear(y) {
  if (hasUnsaved() && !confirm('You have unsaved changes. Switch years anyway?')) return;
  state.edits = {};
  try { await loadYear(y); window.scrollTo({ top: 0 }); } catch (err) { handleErr(err, 'Couldn’t load ' + y); }
}
async function newYear(y) {
  if (!confirm(`Start planning Deltaversary ${y}? Secret Soror, games night, the RCC scholarship and a service project will be added as starting points.`)) return;
  state.edits = {};
  $('#main').innerHTML = '<div class="loading">Setting up ' + esc(y) + '…</div>';
  try { const j = await api({ action: 'newYear', year: y }); applyLoad(j); render(); }
  catch (err) { handleErr(err, 'Couldn’t start ' + y); render(); }
}
async function refresh(quiet) {
  if (hasUnsaved()) { if (!quiet) toast('Save or cancel your open edits first.'); return; }
  try { setSync('Refreshing…'); await loadYear(state.year, true); setSync('Up to date'); }
  catch (err) { setSync(''); if (!quiet) handleErr(err, 'Couldn’t refresh'); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'edit-set' && e.target.closest('a')) return; // let links inside a details card open normally
  if (act === 'edit') startEdit(t.dataset.b, t.dataset.id);
  else if (act === 'add') startAdd(t.dataset.b);
  else if (act === 'edit-set') startEditSettings(t.dataset.b);
  else if (act === 'cancel') cancelEdit(t.dataset.ek);
  else if (act === 'save') save(t.dataset.ek);
  else if (act === 'del') remove(t.dataset.b, t.dataset.id);
  else if (act === 'year') switchYear(t.dataset.year);
  else if (act === 'newyear') newYear(t.dataset.year);
  else if (act === 'refresh') refresh(false);
  else if (act === 'signout') signOut();
  else if (act === 'upload') $('#photo-input').click();
  else if (act === 'zoom') openLightbox(+t.dataset.i);
  else if (act === 'lb-go') openLightbox(+$('#lightbox').dataset.i + +t.dataset.d);
  else if (act === 'lb-close') closeLightbox();
});
function onField(e) {
  const t = e.target; if (!t.dataset || !t.dataset.ek || !t.dataset.k) return;
  if (state.edits[t.dataset.ek]) state.edits[t.dataset.ek][t.dataset.k] = t.value;
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.filter; if (!k) return;
  state.ach[k] = e.target.value; render();
  const el = $('#achievements'); if (el) el.scrollIntoView({ block: 'start' });
});
document.addEventListener('change', onField);
$('#photo-input').addEventListener('change', e => { const f = e.target.files; if (f && f.length) uploadPhotos(f); e.target.value = ''; });
document.addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', e => {
  const lb = $('#lightbox');
  if (lb && !lb.hidden) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') openLightbox(+lb.dataset.i + 1);
    else if (e.key === 'ArrowLeft') openLightbox(+lb.dataset.i - 1);
    return;
  }
  if (e.key === 'Enter' && e.target.matches('.editor input')) { e.preventDefault(); save(e.target.dataset.ek); }
  if (e.key === 'Escape' && e.target.closest('.editor')) { cancelEdit(e.target.dataset.ek); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.loaded) refresh(true); });
window.addEventListener('beforeunload', e => { if (hasUnsaved() || state.pending) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- Weather (Open-Meteo, free, no key) ---------------- */
const WX = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Snow', 73: 'Snow', 75: 'Snow', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 95: 'Thunderstorms', 96: 'Storms', 99: 'Storms' };
const wxCache = {};
async function loadWeather(s) {
  const box = $('#wx'); if (!box) return;
  const start = parseDate(s.StartDate), end = parseDate(s.EndDate) || start;
  if (!s.City || !start) return;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const until = Math.round((start - today) / 864e5);
  if (end < today) { box.innerHTML = `<h4>Weather · ${esc(s.City)}</h4><div class="note">This celebration has passed.</div>`; return; }
  if (until > 15) { box.innerHTML = `<h4>Weather · ${esc(s.City)}</h4><div class="note">The forecast appears here about two weeks before the trip — check back in ${until - 15} days.</div>`; return; }
  const key = s.City + s.StartDate + s.EndDate;
  try {
    if (!wxCache[key]) {
      const city = s.City.split(',')[0].trim();
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=10&language=en&countryCode=US`)).json();
      const st = (s.City.split(',')[1] || '').trim().toUpperCase();
      const place = (g.results || []).find(p => !st || (p.admin1 || '').toUpperCase().startsWith(st) || abbr(p.admin1) === st) || (g.results || [])[0];
      if (!place) throw new Error('City not found');
      const from = start < today ? today : start;
      const iso = d => d.toISOString().slice(0, 10);
      const lastDay = new Date(today); lastDay.setDate(lastDay.getDate() + 15);
      const to = end > lastDay ? lastDay : end;
      const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&start_date=${iso(from)}&end_date=${iso(to)}`)).json();
      wxCache[key] = w.daily;
    }
    const d = wxCache[key];
    box.innerHTML = `<h4>Weather · ${esc(s.City)}</h4><div class="days">${d.time.map((t, i) => `<div class="d"><b>${esc(fmtDate(t).split(',')[0])}</b><div class="t">${Math.round(d.temperature_2m_max[i])}°</div><div class="c">${Math.round(d.temperature_2m_min[i])}° low</div><div class="c">${esc(WX[d.weather_code[i]] || '')}${d.precipitation_probability_max[i] != null ? ` · ${d.precipitation_probability_max[i]}% rain` : ''}</div></div>`).join('')}</div>`;
  } catch (e) {
    box.innerHTML = `<h4>Weather · ${esc(s.City)}</h4><div class="note">Forecast unavailable right now.</div>`;
  }
}
const STATES = { 'NORTH CAROLINA': 'NC', 'SOUTH CAROLINA': 'SC', 'VIRGINIA': 'VA', 'GEORGIA': 'GA', 'FLORIDA': 'FL', 'MARYLAND': 'MD', 'DISTRICT OF COLUMBIA': 'DC', 'TENNESSEE': 'TN', 'ALABAMA': 'AL', 'NEW YORK': 'NY', 'TEXAS': 'TX', 'LOUISIANA': 'LA', 'PENNSYLVANIA': 'PA', 'NEW JERSEY': 'NJ', 'ILLINOIS': 'IL', 'CALIFORNIA': 'CA', 'NEVADA': 'NV', 'ARIZONA': 'AZ', 'MISSISSIPPI': 'MS', 'KENTUCKY': 'KY', 'OHIO': 'OH', 'MICHIGAN': 'MI', 'DELAWARE': 'DE', 'WEST VIRGINIA': 'WV' };
function abbr(name) { return STATES[(name || '').toUpperCase()] || ''; }

initLogin();
</script>
